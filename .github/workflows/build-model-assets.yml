name: Publish scanner models
on:
  workflow_dispatch:
  push:
    paths:
      - model-assets/**
      - models-worker/**
      - scripts/build-model-assets.mjs
      - scripts/verify-model-assets.mjs
      - .github/workflows/build-model-assets.yml
permissions:
  contents: read
concurrency:
  group: chunithmd-model-assets
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/export-score-detector.py --check && python3 scripts/fetch-paddleocr.py --check
      - run: node scripts/build-model-assets.mjs
      - run: pnpm exec wrangler deploy --config models-worker/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: node scripts/verify-model-assets.mjs
